name: Repair PR 46 reidentification audit evidence

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: repair-tepp-pr-46-reidentification-audit
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 46 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/api-provider-payload-minimization'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/api-provider-payload-minimization
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Prove reidentification audit contract is RED
        run: |
          set +e
          output=$(cargo +1.97.1 test -p tepp_api --test reidentification_audit_contract 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected elevated disclosure to lack append-only audit evidence before implementation" >&2
            exit 1
          fi
          grep -E "ReidentificationAudit|disclose_identity_mapping" <<<"$output"

      - name: Apply audited reidentification and documentation repair
        run: |
          python3 scripts/repair_pr46_reidentification_audit.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/tepp_api/src/provider_payload.rs")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  'assert_eq!(disclosed.0.opaque_analytical_id(), "entity-1");',
                  'assert_eq!(disclosed.opaque_analytical_id(), "entity-1");',
              ),
              (
                  'assert_eq!(disclosed.0.direct_identity(), "Pat Lee");',
                  'assert_eq!(disclosed.direct_identity(), "Pat Lee");',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"constructed disclosure accessor target mismatch: {old}")
              text = text.replace(old, new, 1)

          marker = "fn validate_grant(grant: &PurposeGrant) -> Result<(), ApiError> {\n"
          comment = (
              "// Lexicographic comparisons in `validate_grant` and `grant_covers` are valid\n"
              "// only after fixed-width UTC RFC 3339 validation; `TemporalInstant` also\n"
              "// rejects impossible calendar dates and leap seconds before comparison.\n"
              "fn validate_grant(grant: &PurposeGrant) -> Result<(), ApiError> {\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("grant comparison invariant marker mismatch")
          path.write_text(text.replace(marker, comment, 1), encoding="utf-8")
          PY
          cargo +1.97.1 fmt --all

      - name: Verify focused and workspace contracts
        run: |
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test -p tepp_api --all-features
          cargo +1.97.1 clippy -p tepp_api --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --workspace --all-features
          python3 scripts/check_docstrings.py
          python3 scripts/validate_documentation.py

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -f .github/workflows/repair-pr46-reidentification-audit.yml
          rm -f scripts/repair_pr46_reidentification_audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(api): audit elevated reidentification decisions"
          git push origin HEAD:agent/api-provider-payload-minimization
