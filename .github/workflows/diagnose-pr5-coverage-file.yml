name: Diagnose PR 5 coverage file

on:
  push:
    branches:
      - agent/task-3-six-clock-intervals
    paths:
      - ".github/workflows/diagnose-pr5-coverage-file.yml"

permissions:
  contents: read

concurrency:
  group: tepp-pr5-coverage-file-diagnosis
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_LLVM_COV_VERSION: "0.8.6"

jobs:
  diagnose:
    name: Locate incomplete file summary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain with LLVM tools
        run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
      - name: Restore pinned cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-${{ runner.arch }}-tepp-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Verify pinned cargo-llvm-cov version
        run: cargo llvm-cov --version | grep -F "$CARGO_LLVM_COV_VERSION"
      - name: Generate exact summary
        run: cargo llvm-cov --workspace --all-features --json --summary-only --output-path coverage.json
      - name: Print incomplete per-file totals
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          incomplete = []
          for data in report.get("data", []):
              for file_record in data.get("files", []):
                  summary = file_record.get("summary", {})
                  lines = summary.get("lines", {})
                  covered = int(lines.get("covered", 0))
                  count = int(lines.get("count", 0))
                  if covered < count:
                      filename = file_record.get("filename", "<unknown>")
                      incomplete.append((filename, covered, count))
                      print(f"INCOMPLETE_FILE {filename} {covered}/{count}")

          totals = report.get("data", [{}])[0].get("totals", {}).get("lines", {})
          print(f"TOTAL_LINES {totals.get('covered')}/{totals.get('count')}")
          if not incomplete:
              raise SystemExit("no incomplete per-file summary was found")
          PY
