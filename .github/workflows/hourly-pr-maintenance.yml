name: Hourly PR Maintenance

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tepp-hourly-pr-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Review, repair, revalidate, and merge
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@8319ae5beda1b4dcbc9c2b189f38d951c2c61b7a
