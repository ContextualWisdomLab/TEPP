name: Verify PR 159 LineageWeave project history

on:
  push:
    branches:
      - feat/lineageweave-project-history-projection

permissions:
  contents: write

concurrency:
  group: verify-pr159-lineageweave-project-history
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify the published LineageWeave contract markers
        run: |
          python - <<'PY'
          from pathlib import Path

          project_history = Path('crates/tepp_api/src/project_history.rs').read_text(encoding='utf-8')
          live = Path('crates/tepp_api/src/naruon_live.rs').read_text(encoding='utf-8')
          lib = Path('crates/tepp_api/src/lib.rs').read_text(encoding='utf-8')
          required = {
              'project_history.rs': [
                  'availability_basis',
                  'temporal_association_only',
                  'ProjectHistoryRequest',
                  'ProjectHistoryProjection',
                  'lineageweave_project_history_exchange',
              ],
              'naruon_live.rs': ['lineageweave', 'project-histories'],
              'lib.rs': ['PROJECT_HISTORY_PATH', 'ProjectHistoryProjection'],
          }
          sources = {
              'project_history.rs': project_history,
              'naruon_live.rs': live,
              'lib.rs': lib,
          }
          missing = [
              f'{name}: {needle}'
              for name, needles in required.items()
              for needle in needles
              if needle not in sources[name]
          ]
          if missing:
              raise SystemExit('Missing TEPP project-history contract markers:\n' + '\n'.join(missing))
          PY

      - name: Verify focused and repository contracts
        run: |
          cargo fmt --all -- --check
          cargo test -p tepp_api --all-targets
          cargo clippy -p tepp_api --all-targets -- -D warnings
          cargo doc -p tepp_api --no-deps
          python3 scripts/check_docstrings.py
          python3 scripts/check_workspace_contract.py
          python3 scripts/validate_documentation.py

      - name: Remove temporary repair automation after verification
        env:
          BRANCH_NAME: feat/lineageweave-project-history-projection
        run: |
          find .github/workflows -maxdepth 1 -type f \( -name 'repair-159-*' -o -name 'verify-159-lineageweave-project-history.yml' \) -print -delete > /tmp/removed_paths
          find scripts -maxdepth 1 -type f -name 'repair_pr159*' -print -delete >> /tmp/removed_paths
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          while IFS= read -r path; do
            [ -n "$path" ] && git add -- "$path"
          done < /tmp/removed_paths
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: retire verified TEPP history repair automation"
          git push origin "HEAD:${BRANCH_NAME}"
