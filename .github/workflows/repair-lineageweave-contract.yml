name: One-shot LineageWeave contract formatting repair

on:
  push:
    branches:
      - feat/lineageweave-live-consumer-contract
    paths:
      - .github/workflows/repair-lineageweave-contract.yml

permissions:
  contents: write

concurrency:
  group: repair-lineageweave-contract
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/lineageweave-live-consumer-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward to the live branch tip
        run: |
          git fetch origin feat/lineageweave-live-consumer-contract
          git merge --ff-only origin/feat/lineageweave-live-consumer-contract

      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Remove test-only imports from production and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/tepp_api/src/analysis_run_live.rs")
          text = path.read_text(encoding="utf-8")
          old = '''use std::net::{IpAddr, SocketAddr, TcpListener, TcpStream};
          use std::time::Duration;

          use crate::lineageweave_http::{
              LINEAGEWEAVE_CONSUMER_CODE, NARUON_CONSUMER_CODE, consumer_is_supported,
          };
          '''
          new = '''use std::net::{IpAddr, SocketAddr, TcpListener};

          use crate::lineageweave_http::consumer_is_supported;
          '''
          if text.count(old) != 1:
              raise SystemExit("analysis_run_live import anchor changed")
          text = text.replace(old, new, 1)
          old_test = '''    use super::{
                  AnalysisRunLiveService, LINEAGEWEAVE_CONSUMER_CODE, NARUON_CONSUMER_CODE,
                  consumer_tenant_idempotency_key, host_is_loopback,
              };
              use crate::ApiError;
          '''
          new_test = '''    use super::{AnalysisRunLiveService, consumer_tenant_idempotency_key, host_is_loopback};
              use crate::{ApiError, LINEAGEWEAVE_CONSUMER_CODE, NARUON_CONSUMER_CODE};
          '''
          if text.count(old_test) != 1:
              raise SystemExit("analysis_run_live test import anchor changed")
          path.write_text(text.replace(old_test, new_test, 1), encoding="utf-8")
          PY
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fmt --all -- --check

      - name: Commit verified formatting repair and remove one-shot workflow
        run: |
          git rm .github/workflows/repair-lineageweave-contract.yml
          git config user.name "CWL TEPP Contract Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): format and compile the LineageWeave contract"
          git pull --rebase origin feat/lineageweave-live-consumer-contract
          git push origin HEAD:feat/lineageweave-live-consumer-contract
