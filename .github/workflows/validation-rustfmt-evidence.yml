name: Validation Rustfmt Evidence

on:
  push:
    branches:
      - fix/validation-bias-overflow-safe-mean
    paths:
      - "crates/**"
      - ".github/workflows/validation-rustfmt-evidence.yml"

permissions:
  contents: read

concurrency:
  group: validation-rustfmt-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          persist-credentials: false
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Materialize canonical rustfmt output
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          git diff --check
          git diff --binary > "${RUNNER_TEMP}/rustfmt.patch"
          git diff --name-only --diff-filter=ACM -z | tar --null -T - -cf "${RUNNER_TEMP}/rustfmt-tree.tar"
          git diff --name-only --diff-filter=ACM > "${RUNNER_TEMP}/rustfmt-files.txt"
          test -s "${RUNNER_TEMP}/rustfmt.patch"
          test -s "${RUNNER_TEMP}/rustfmt-files.txt"
      - name: Upload immutable formatting evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-rustfmt-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rustfmt.patch
            ${{ runner.temp }}/rustfmt-tree.tar
            ${{ runner.temp }}/rustfmt-files.txt
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
