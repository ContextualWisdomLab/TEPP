name: Materialize TEPP Bootstrap v3

on:
  push:
    branches:
      - agent/bootstrap-tepp-planning
    paths:
      - .bootstrap/READY3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tepp-bootstrap-materialize-v3
  cancel-in-progress: false

jobs:
  materialize:
    name: Reconstruct and validate repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/bootstrap-tepp-planning
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap -maxdepth 1 -name 'v3-*.txt' | wc -l)" -eq 14
          cat .bootstrap/v3-*.txt | base64 --decode > /tmp/tepp-bootstrap.tar.xz
          echo "6ba8232a1627724e00be47c8b77a12dfdf33f50b01cac280d05bffa4e7fca401  /tmp/tepp-bootstrap.tar.xz" | sha256sum --check -
          tar -xJf /tmp/tepp-bootstrap.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-materialize.yml
          rm -f .github/workflows/bootstrap-materialize-v2.yml
          rm -f .github/workflows/bootstrap-materialize-v3.yml
          python3 scripts/validate_documentation.py

      - name: Commit materialized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add approved TEPP planning baseline"
          git push origin HEAD:agent/bootstrap-tepp-planning
