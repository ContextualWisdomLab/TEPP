name: Repair PR 55 immutable workflow binding

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: repair-tepp-pr-55-immutable-workflow-binding
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 55 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/org-github-control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/org-github-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview

      - name: Prove the pre-implementation identity contract was RED
        run: |
          git worktree add "$RUNNER_TEMP/tepp-red" 5a8401756fb21627ea9648977e87f4dad182275a
          set +e
          output=$(cd "$RUNNER_TEMP/tepp-red" && cargo +1.97.1 test -p tepp_api --test org_github_identity_security_contract 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          git worktree remove --force "$RUNNER_TEMP/tepp-red"
          if [ "$status" -eq 0 ]; then
            echo "Expected mutable or look-alike workflow identities to fail the new contract" >&2
            exit 1
          fi
          grep -E "canonical_workflow_requires|hostile or mutable" <<<"$output"

      - name: Merge current protected main without discarding feature behavior
        run: |
          git fetch origin main
          git merge --no-edit -X ours origin/main

      - name: Refuse mutable workflow examples in product documentation
        run: |
          if git grep -n -E 'ContextualWisdomLab/\.github/\.github/workflows/[^ @]+@(main|master|develop|HEAD)' -- '*.md' '*.rs'; then
            echo "Mutable org-workflow references remain" >&2
            exit 1
          fi

      - name: Verify focused and workspace contracts
        run: |
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test -p tepp_api --all-features
          cargo +1.97.1 clippy -p tepp_api --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --workspace --all-features
          python3 scripts/check_workspace_contract.py
          python3 scripts/check_docstrings.py
          python3 scripts/validate_documentation.py

      - name: Enforce exact authored coverage
        run: |
          cargo +1.97.1 install cargo-llvm-cov --locked --version 0.8.6
          cargo +1.97.1 llvm-cov -p tepp_api --all-features --fail-under-lines 100
          cargo +nightly-2026-08-01 llvm-cov --branch -p tepp_api --all-features --json --summary-only --output-path coverage-branches.json
          python3 scripts/check_coverage.py coverage-branches.json --kind branches

      - name: Commit verified merge and remove one-shot workflow
        run: |
          rm -f coverage-branches.json
          rm -f .github/workflows/repair-pr55-immutable-workflow-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(api): pin org workflow identities to commits"
          fi
          git push origin HEAD:agent/org-github-control-plane
