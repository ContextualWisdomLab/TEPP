name: Repair PR 155 review findings

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/lineageweave-live-consumer-contract"
    paths:
      - ".github/workflows/repair-pr-155-review-findings.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr-155-review-findings
  cancel-in-progress: false

jobs:
  repair:
    name: Apply review findings with red-green evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/lineageweave-live-consumer-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Add malformed-report regressions first and prove RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/quality/test_check_coverage.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''            ([{"filename": "", "branches": []}], "must contain a filename"),
            ([{"filename": "src.rs", "branches": {}}], "branches must be a list"),'''
          replacement = '''            ([{"filename": "", "branches": []}], "must contain a filename"),
            ([{"filename": "src.rs"}], "must contain branches"),
            ([{"filename": "src.rs", "branches": {}}], "branches must be a list"),
            (
                [{"filename": "src.rs", "branches": [[True, 2, 3, 4, 1, 0]]}],
                "coordinates are invalid",
            ),
            (
                [{"filename": "src.rs", "branches": [[1, 2, 3, 4, 0.5, 0]]}],
                "counts are invalid",
            ),'''
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit("refusing unknown malformed-report fixture shape")
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

          set +e
          python -m unittest \
            tests.quality.test_check_coverage.CoverageContractTests.test_full_branch_reports_fail_closed_on_malformed_records \
            > /tmp/coverage-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/coverage-red.log
          if [ "$red_status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fail-closed repair" >&2
            exit 1
          fi

      - name: Apply the verified narrow fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          coverage_path = Path("scripts/check_coverage.py")
          coverage = coverage_path.read_text(encoding="utf-8")
          coverage = coverage.replace(
              'outcomes: dict[tuple[str, int, int, int, int], list[int | float]] = {}',
              'outcomes: dict[tuple[str, int, int, int, int], list[int]] = {}',
              1,
          )
          old_branch_read = '''        filename = file_record.get("filename")
        branches = file_record.get("branches", [])
        if not isinstance(filename, str) or not filename:
            raise ValueError("coverage file record must contain a filename")
        if not isinstance(branches, list):'''
          new_branch_read = '''        filename = file_record.get("filename")
        if "branches" not in file_record:
            raise ValueError("coverage file record must contain branches")
        branches = file_record["branches"]
        if not isinstance(filename, str) or not filename:
            raise ValueError("coverage file record must contain a filename")
        if not isinstance(branches, list):'''
          if new_branch_read not in coverage:
              if old_branch_read not in coverage:
                  raise SystemExit("refusing unknown coverage file-record shape")
              coverage = coverage.replace(old_branch_read, new_branch_read, 1)
          old_coordinates = '''            if not all(isinstance(value, int) and value >= 0 for value in coordinates):
                raise ValueError("coverage branch coordinates are invalid")
            if not all(
                isinstance(value, (int, float))
                and not isinstance(value, bool)
                and value >= 0
                for value in counts
            ):'''
          new_coordinates = '''            if not all(
                isinstance(value, int) and not isinstance(value, bool) and value >= 0
                for value in coordinates
            ):
                raise ValueError("coverage branch coordinates are invalid")
            if not all(
                isinstance(value, int) and not isinstance(value, bool) and value >= 0
                for value in counts
            ):'''
          if new_coordinates not in coverage:
              if old_coordinates not in coverage:
                  raise SystemExit("refusing unknown branch scalar validation shape")
              coverage = coverage.replace(old_coordinates, new_coordinates, 1)
          coverage_path.write_text(coverage, encoding="utf-8")

          contract_path = Path("crates/tepp_api/tests/lineageweave_http_contract.rs")
          contract = contract_path.read_text(encoding="utf-8")
          old_import = '''    ApiError, LINEAGEWEAVE_CONSUMER_CODE, NARUON_ANALYSIS_RUN_PATH, NARUON_LIVE_HEADER_BYTE_LIMIT,
    lineageweave_analysis_run_exchange,'''
          new_import = '''    ApiError, LINEAGEWEAVE_CONSUMER_CODE, NARUON_ANALYSIS_RUN_PATH, NARUON_CONSUMER_CODE,
    NARUON_LIVE_HEADER_BYTE_LIMIT, lineageweave_analysis_run_exchange,'''
          if new_import not in contract:
              if old_import not in contract:
                  raise SystemExit("refusing unknown lineageweave contract import shape")
              contract = contract.replace(old_import, new_import, 1)
          contract = contract.replace(
              'let naruon = service.handle_http_request(&http_request("naruon", &run));',
              'let naruon = service.handle_http_request(&http_request(NARUON_CONSUMER_CODE, &run));',
              1,
          )
          contract_path.write_text(contract, encoding="utf-8")

          adr_path = Path("docs/adr/0017-consumer-scoped-analysis-run-ingress.md")
          adr = adr_path.read_text(encoding="utf-8")
          old_claim = (
              "An HTTP `202 Accepted` response means only that TEPP accepted a durable "
              "analysis-run identity for later execution. It is not a completed temporal "
              "model, calibrated score, theta estimate, uncertainty statement, or scientific claim."
          )
          new_claim = (
              "An HTTP `202 Accepted` response means only that TEPP accepted an analysis-run "
              "identity for later execution. In the current loopback proof the accepted-run "
              "registry is in-memory and is not durable across restarts; persistence remains "
              "separate work. The response is not a completed temporal model, calibrated score, "
              "theta estimate, uncertainty statement, or scientific claim."
          )
          if new_claim not in adr:
              if old_claim not in adr:
                  raise SystemExit("refusing unknown ADR 0017 claim boundary")
              adr = adr.replace(old_claim, new_claim, 1)
          adr_path.write_text(adr, encoding="utf-8")

          validator_path = Path("scripts/validate_documentation.py")
          validator = validator_path.read_text(encoding="utf-8")
          validator_anchor = '    "docs/adr/0016-tdt-chronos-event-intelligence-boundary.md",\n'
          validator_replacement = (
              validator_anchor
              + '    "docs/adr/0017-consumer-scoped-analysis-run-ingress.md",\n'
          )
          if validator_replacement not in validator:
              if validator_anchor not in validator:
                  raise SystemExit("refusing unknown documentation validator ADR list")
              validator = validator.replace(validator_anchor, validator_replacement, 1)
          validator_path.write_text(validator, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          added_anchor = (
              "- `tepp_api` LineageWeave consumer-scoped analysis-run ingress: versioned, "
              "credential-free requests use a published consumer identity and isolate idempotency "
              "by consumer, tenant workspace, and opaque caller key; the one-shot restack workflow "
              "is removed after the protected-main merge is verified.\n"
          )
          adr_entry = (
              "- ADR 0017 records the consumer-scoped analysis-run ingress, its in-memory "
              "loopback maturity, and the persistence boundary required before production use.\n"
          )
          if adr_entry not in changelog:
              if added_anchor not in changelog:
                  raise SystemExit("refusing unknown CHANGELOG consumer-ingress entry")
              changelog = changelog.replace(added_anchor, added_anchor + adr_entry, 1)
          if "ADR 0001–0016" in changelog:
              changelog = changelog.replace("ADR 0001–0016", "ADR 0001–0017")
          elif "ADR 0001-0016" in changelog:
              changelog = changelog.replace("ADR 0001-0016", "ADR 0001-0017")
          elif "ADR 0001–0017" not in changelog and "ADR 0001-0017" not in changelog:
              raise SystemExit("refusing unknown CHANGELOG ADR quality range")
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Prove GREEN and validate the affected contracts
        shell: bash
        run: |
          python -m unittest tests.quality.test_check_coverage
          python scripts/validate_documentation.py
          cargo fmt --check
          cargo test -p tepp_api --test lineageweave_http_contract

      - name: Remove the repair workflow and publish the verified patch
        shell: bash
        run: |
          rm .github/workflows/repair-pr-155-review-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check_coverage.py \
            tests/quality/test_check_coverage.py \
            crates/tepp_api/tests/lineageweave_http_contract.rs \
            docs/adr/0017-consumer-scoped-analysis-run-ingress.md \
            scripts/validate_documentation.py \
            CHANGELOG.md \
            .github/workflows/repair-pr-155-review-findings.yml
          git diff --cached --check
          git commit -m "fix: close PR 155 review findings"
          git push origin HEAD:feat/lineageweave-live-consumer-contract
