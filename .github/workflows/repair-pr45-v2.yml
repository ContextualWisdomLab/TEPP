name: Repair PR 45 retention lifecycle v2

on:
  pull_request:
    types:
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: repair-tepp-pr-45-v2
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 45 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/persistence-retention-legal-hold'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: tepp
          POSTGRES_PASSWORD: tepp_ci
          POSTGRES_DB: tepp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tepp -d tepp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tepp:tepp_ci@localhost:5432/tepp
      CARGO_LLVM_COV_VERSION: "0.8.6"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/persistence-retention-legal-hold
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview

      - name: Add regression tests
        run: |
          python3 scripts/repair_pr45_add_tests.py
          python3 scripts/repair_pr45_add_lock_tests.py

      - name: Prove tenant binding is RED before implementation
        run: |
          set +e
          output=$(cargo +1.97.1 test -p persistence_postgres tenant_scoped_insert_binds_session_context 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected tenant binding regression to fail before implementation" >&2
            exit 1
          fi
          grep -F "tenant_scoped_insert_binds_session_context" <<<"$output"
          grep -F "tenant-scoped insert must bind the session before the INSERT" <<<"$output"

      - name: Apply implementation and migration fixes
        run: |
          python3 scripts/repair_pr45_apply_fixes.py
          python3 scripts/repair_pr45_apply_lock_fixes.py

      - name: Format and run persistence verification
        run: |
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test -p persistence_postgres --lib --tests
          cargo +1.97.1 clippy -p persistence_postgres --all-targets --all-features -- -D warnings

      - name: Run live PostgreSQL integration
        env:
          TEPP_LIVE_POSTGRES: "1"
        run: cargo +1.97.1 test -p persistence_postgres --features live-sqlx --test live_postgres -- --nocapture

      - name: Run full workspace and documentation verification
        run: |
          cargo +1.97.1 test --workspace --all-features
          python3 scripts/check_docstrings.py
          python3 scripts/check_workspace_contract.py
          python3 scripts/validate_documentation.py

      - name: Install pinned coverage tool
        run: cargo +1.97.1 install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"

      - name: Enforce exact line and branch coverage
        run: |
          cargo +1.97.1 llvm-cov --workspace --all-features --lcov --output-path coverage.lcov --ignore-filename-regex 'sqlx_live\\.rs'
          python3 - <<'PY'
          from pathlib import Path

          current_file = None
          missing = []
          for raw_line in Path("coverage.lcov").read_text(encoding="utf-8").splitlines():
              if raw_line.startswith("SF:"):
                  current_file = raw_line[3:]
              elif raw_line.startswith("DA:") and current_file is not None:
                  line_number, hit_count, *_ = raw_line[3:].split(",")
                  if int(hit_count) == 0:
                      missing.append(f"{current_file}:{line_number}")
          print("Uncovered executable lines:")
          print("\n".join(missing) if missing else "none")
          PY
          python3 scripts/check_coverage.py coverage.lcov --kind lines --format lcov
          cargo +nightly-2026-08-01 llvm-cov --branch --workspace --all-features --json --summary-only --output-path coverage-branches.json --ignore-filename-regex 'sqlx_live\\.rs'
          python3 scripts/check_coverage.py coverage-branches.json --kind branches

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -f coverage.lcov coverage-branches.json
          rm -f .github/workflows/repair-pr45.yml
          rm -f .github/workflows/repair-pr45-v2.yml
          rm -f .github/workflows/repair-pr45-append-audit.yml
          rm -f scripts/repair_pr45_add_tests.py
          rm -f scripts/repair_pr45_add_lock_tests.py
          rm -f scripts/repair_pr45_apply_fixes.py
          rm -f scripts/repair_pr45_apply_lock_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(persistence): close retention lifecycle review gaps"
          git push origin HEAD:agent/persistence-retention-legal-hold
