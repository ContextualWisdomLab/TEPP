name: One-shot restack LineageWeave consumer contract

on:
  push:
    branches:
      - feat/lineageweave-live-consumer-contract
  pull_request:

permissions:
  contents: write

concurrency:
  group: one-shot-restack-lineageweave-consumer
  cancel-in-progress: true

jobs:
  restack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: feat/lineageweave-live-consumer-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Merge the protected main head without rewriting history
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Verify Rust formatting, tests, lint, and docs
        run: |
          cargo fmt --all -- --check
          cargo test -p tepp_api --all-targets
          cargo clippy -p tepp_api --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc -p tepp_api --no-deps

      - name: Verify repository contracts
        run: |
          python3 scripts/validate_documentation.py
          python3 scripts/check_docstrings.py
          python3 -m unittest discover -s tests/quality -p 'test_*.py'

      - name: Remove the completed restack workflow
        run: |
          rm .github/workflows/one-shot-restack-lineageweave-consumer.yml
          git add -A
          git commit -m "chore: finish LineageWeave consumer restack"
          git diff --check HEAD^ HEAD

      - name: Publish verified restack
        run: git push origin HEAD:feat/lineageweave-live-consumer-contract
