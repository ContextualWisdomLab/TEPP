name: Finalize PR 159 LineageWeave project history

on:
  push:
    branches:
      - feat/lineageweave-project-history-projection

permissions:
  contents: write

concurrency:
  group: finalize-pr159-lineageweave-project-history
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest stacked head
        uses: actions/checkout@v4
        with:
          ref: feat/lineageweave-project-history-projection
          fetch-depth: 0
          persist-credentials: true

      - name: Record exact input head
        run: git rev-parse HEAD > /tmp/pr159_input_sha

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify the public project-history contract
        run: |
          python - <<'PY'
          from pathlib import Path

          project_history = Path("crates/tepp_api/src/project_history.rs").read_text(encoding="utf-8")
          live_sources = "\n".join(
              path.read_text(encoding="utf-8")
              for path in (
                  Path("crates/tepp_api/src/analysis_run_live.rs"),
                  Path("crates/tepp_api/src/naruon_live.rs"),
              )
              if path.exists()
          )
          public = Path("crates/tepp_api/src/lib.rs").read_text(encoding="utf-8")
          required = {
              "project_history.rs": (
                  "ProjectHistoryRequest",
                  "ProjectHistoryProjection",
                  "availability_basis",
                  "temporal_association_only",
                  "lineageweave_project_history_exchange",
              ),
              "live listener": ("project-histories", "lineageweave"),
              "lib.rs": ("PROJECT_HISTORY_PATH", "ProjectHistoryProjection"),
          }
          sources = {
              "project_history.rs": project_history,
              "live listener": live_sources,
              "lib.rs": public,
          }
          missing = [
              f"{name}: {symbol}"
              for name, symbols in required.items()
              for symbol in symbols
              if symbol not in sources[name]
          ]
          if missing:
              raise SystemExit("Missing project-history contract markers:\n" + "\n".join(missing))
          PY

      - name: Verify Rust and repository contracts
        run: |
          cargo fmt --all -- --check
          cargo test -p tepp_api --all-targets
          cargo clippy -p tepp_api --all-targets -- -D warnings
          cargo doc -p tepp_api --no-deps
          python3 scripts/check_docstrings.py
          python3 scripts/check_workspace_contract.py
          python3 scripts/validate_documentation.py

      - name: Refuse a stale-head publication
        env:
          BRANCH_NAME: feat/lineageweave-project-history-projection
        run: |
          expected="$(cat /tmp/pr159_input_sha)"
          remote="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test -n "$remote"
          test "$remote" = "$expected"

      - name: Retire temporary repair automation
        env:
          BRANCH_NAME: feat/lineageweave-project-history-projection
        run: |
          removed=/tmp/pr159_removed_paths
          : > "$removed"
          for path in \
            .github/workflows/verify-159-lineageweave-project-history.yml \
            .github/workflows/finalize-159-lineageweave-project-history.yml; do
            if test -e "$path"; then
              rm -f "$path"
              printf '%s\n' "$path" >> "$removed"
            fi
          done
          find .github/workflows -maxdepth 1 -type f -name 'repair-159-*' -print -delete >> "$removed"
          find scripts -maxdepth 1 -type f -name 'repair_pr159*' -print -delete >> "$removed"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          while IFS= read -r path; do
            test -n "$path" && git add -- "$path"
          done < "$removed"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: retire verified TEPP history repair automation"
          git push origin "HEAD:${BRANCH_NAME}"
