name: Rust Foundation CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "requirements-quality.txt"
      - ".coveragerc"
      - ".config/**"
      - "crates/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/quality/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "requirements-quality.txt"
      - ".coveragerc"
      - ".config/**"
      - "crates/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/quality/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tepp-rust-foundation-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: TEPP Rust Foundation supplier
    uses: ContextualWisdomLab/.github/.github/workflows/tepp-rust-foundation-ci.yml@3136c940235a3762b804bd99eb20fbe129e70c06
    permissions:
      contents: read
