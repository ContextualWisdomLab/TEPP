name: Documentation Quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.json"
      - ".github/workflows/**"
      - "scripts/validate_documentation.py"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.json"
      - ".github/workflows/**"
      - "scripts/validate_documentation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate planning and governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          persist-credentials: false
      - name: Validate documentation
        run: python3 scripts/validate_documentation.py
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check

  repair_timeout_contract:
    name: Restore loopback timeout contract
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/lineageweave-project-history-projection'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact contributor head without persisted credentials
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Apply and verify the bounded test-contract repair
        run: python3 scripts/repair_pr_159_timeout_contract.py

      - name: Publish only after exact-head verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --no-tags origin feat/lineageweave-project-history-projection
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git show HEAD^:.github/workflows/docs-quality.yml > .github/workflows/docs-quality.yml
          rm scripts/repair_pr_159_timeout_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: enforce the loopback I/O deadline"
          git push "https://x-access-token:${GH_TOKEN}@github.com/ContextualWisdomLab/TEPP.git" HEAD:feat/lineageweave-project-history-projection
