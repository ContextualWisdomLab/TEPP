name: Documentation Quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "**/*.md"
      - "**/*.json"
      - ".github/workflows/**"
      - "scripts/validate_documentation.py"
      - "tests/quality/test_validate_documentation.py"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.json"
      - ".github/workflows/**"
      - "scripts/validate_documentation.py"
      - "tests/quality/test_validate_documentation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: TEPP Documentation supplier
    uses: ContextualWisdomLab/.github/.github/workflows/tepp-documentation-quality.yml@3136c940235a3762b804bd99eb20fbe129e70c06
    permissions:
      contents: read
