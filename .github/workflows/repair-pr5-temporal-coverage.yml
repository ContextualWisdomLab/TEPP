name: Diagnose PR 5 temporal coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-pr5-temporal-coverage.yml
      - crates/temporal_core/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: diagnose-pr5-temporal-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'ContextualWisdomLab/TEPP' &&
      github.event.pull_request.head.ref == 'agent/task-3-six-clock-intervals'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
      CARGO_LLVM_COV_VERSION: "0.8.6"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull-request head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust coverage toolchain
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview

      - name: Restore pinned cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-${{ runner.arch }}-tepp-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-llvm-cov on cache miss
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"

      - name: Report exact uncovered production lines
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cargo fmt --all -- --check
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          python3 - <<'PY'
          from pathlib import Path

          current_file = None
          uncovered: list[tuple[str, int]] = []
          for raw_line in Path("lcov.info").read_text(encoding="utf-8").splitlines():
              if raw_line.startswith("SF:"):
                  current_file = raw_line[3:]
              elif raw_line.startswith("DA:") and current_file is not None:
                  line_number, hit_count, *_ = raw_line[3:].split(",")
                  if int(hit_count) == 0:
                      uncovered.append((current_file, int(line_number)))

          if uncovered:
              print("UNCOVERED_PRODUCTION_LINES_BEGIN")
              for file_name, line_number in uncovered:
                  print(f"{file_name}:{line_number}")
              print("UNCOVERED_PRODUCTION_LINES_END")
              raise SystemExit(1)

          print("All production lines are covered.")
          PY
