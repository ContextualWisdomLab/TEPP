name: Repair temporal error-mapping coverage

on:
  push:
    branches:
      - agent/task-3-six-clock-intervals
    paths:
      - .github/workflows/repair-temporal-map-error-helper.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tepp-repair-temporal-map-error-helper
  cancel-in-progress: false

jobs:
  repair:
    name: Patch, verify, commit, and self-delete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/task-3-six-clock-intervals
          fetch-depth: 0
          persist-credentials: true

      - name: Replace the inline closure with a named error mapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/temporal_core/src/wire.rs")
          source_text = source_path.read_text(encoding="utf-8")
          previous = '''fn serialize_wire<T: Serialize>(value: &T) -> Result<String, TemporalError> {
              serde_json::to_string(value).map_err(|_| TemporalError::InvalidWirePayload)
          }
          '''
          replacement = '''fn invalid_wire_payload(_error: serde_json::Error) -> TemporalError {
              TemporalError::InvalidWirePayload
          }

          fn serialize_wire<T: Serialize>(value: &T) -> Result<String, TemporalError> {
              serde_json::to_string(value).map_err(invalid_wire_payload)
          }
          '''
          if source_text.count(previous) != 1:
              raise SystemExit("expected exactly one temporal serialization helper")
          source_path.write_text(source_text.replace(previous, replacement), encoding="utf-8")
          PY

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview

      - name: Install pinned line coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.8.6

      - name: Verify formatting, linting, tests, and exact line coverage
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo llvm-cov --workspace --all-features --json --summary-only --output-path coverage.json
          python3 scripts/check_coverage.py coverage.json --kind lines

      - name: Commit verified repair and remove this workflow
        run: |
          rm .github/workflows/repair-temporal-map-error-helper.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/temporal_core/src/wire.rs .github/workflows/repair-temporal-map-error-helper.yml
          git commit -m "fix(temporal): make wire error mapping coverage-stable"
          git push origin HEAD:agent/task-3-six-clock-intervals
