name: Diagnose PR 5 line coverage

on:
  push:
    branches:
      - agent/task-3-six-clock-intervals
    paths:
      - ".github/workflows/diagnose-pr5-line-coverage.yml"

permissions:
  contents: read

concurrency:
  group: tepp-pr5-line-coverage-diagnosis
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_LLVM_COV_VERSION: "0.8.6"

jobs:
  diagnose:
    name: Locate uncovered production regions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain with LLVM tools
        run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
      - name: Restore pinned cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-${{ runner.arch }}-tepp-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Verify pinned cargo-llvm-cov version
        run: cargo llvm-cov --version | grep -F "$CARGO_LLVM_COV_VERSION"
      - name: Generate LCOV and full JSON diagnostics
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          cargo llvm-cov report --json --output-path coverage-full.json
      - name: Print exact uncovered source locations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          current_source = None
          uncovered_lines = []
          for raw_line in Path("lcov.info").read_text(encoding="utf-8").splitlines():
              if raw_line.startswith("SF:"):
                  current_source = raw_line[3:]
              elif raw_line.startswith("DA:") and current_source is not None:
                  line_number, count, *_ = raw_line[3:].split(",")
                  if int(count) == 0:
                      uncovered_lines.append((current_source, int(line_number)))

          print("LCOV_UNCOVERED_BEGIN")
          for source, line_number in uncovered_lines:
              print(f"UNCOVERED_LINE {source}:{line_number}")
          print("LCOV_UNCOVERED_END")

          report = json.loads(Path("coverage-full.json").read_text(encoding="utf-8"))
          uncovered_segments = []
          for data in report.get("data", []):
              for file_record in data.get("files", []):
                  filename = file_record.get("filename", "<unknown>")
                  for segment in file_record.get("segments", []):
                      if len(segment) >= 4 and segment[3] and segment[2] == 0:
                          uncovered_segments.append((filename, segment[0], segment[1]))

          print("JSON_UNCOVERED_BEGIN")
          for filename, line_number, column_number in uncovered_segments:
              print(f"UNCOVERED_SEGMENT {filename}:{line_number}:{column_number}")
          print("JSON_UNCOVERED_END")

          if not uncovered_lines and not uncovered_segments:
              raise SystemExit("coverage totals are incomplete but no zero-count location was found")
          PY
