name: Materialize TEPP Bootstrap

on:
  push:
    branches:
      - agent/bootstrap-tepp-planning
    paths:
      - .bootstrap/READY
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: tepp-bootstrap-materialize
  cancel-in-progress: false

jobs:
  materialize:
    name: Reconstruct and validate repository baseline
    if: github.event_name == 'push' || github.head_ref == 'agent/bootstrap-tepp-planning'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/bootstrap-tepp-planning
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, verify, and extract payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c .bootstrap/v3-*.txt
          sha256sum .bootstrap/v3-*.txt
          cat .bootstrap/v3-*.txt | base64 --decode > /tmp/tepp-bootstrap.tar.xz
          sha256sum /tmp/tepp-bootstrap.tar.xz
          echo "6ba8232a1627724e00be47c8b77a12dfdf33f50b01cac280d05bffa4e7fca401  /tmp/tepp-bootstrap.tar.xz" | sha256sum --check -
          tar -xJf /tmp/tepp-bootstrap.tar.xz -C .
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          manifest_path = root / "docs/archive/source-material/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for entry in manifest["artifacts"]:
              path = root / entry["repository_path"]
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              print(
                  "SOURCE-CHECK",
                  entry["repository_path"],
                  "manifest=", entry["sha256"],
                  "actual=", actual,
                  "bytes=", path.stat().st_size,
              )
          PY
          python3 scripts/build_archives.py
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-materialize.yml
          python3 scripts/validate_documentation.py

      - name: Commit materialized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add approved TEPP planning baseline"
          git push origin HEAD:agent/bootstrap-tepp-planning
