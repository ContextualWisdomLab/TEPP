name: Repair PR 49 scientific claim boundaries

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: repair-tepp-pr-49-scientific-claims
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 49 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/psychometric-posterior-esem-input'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/psychometric-posterior-esem-input
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Prove geometry and posterior-summary contracts are RED
        run: |
          set +e
          output=$(cargo +1.97.1 test -p psychometric_core --test scientific_claim_boundary_contract 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected old API to lack ALR geometry and honest point-estimate boundaries" >&2
            exit 1
          fi
          grep -E "is_valid_structural_input|preserves_aitchison_distance|posterior_draw_point_estimate_mean|recover_loading_point_estimate_mean" <<<"$output"

      - name: Apply scientific claim repair
        run: |
          python3 scripts/repair_pr49_scientific_claims.py
          python3 - <<'PY'
          from pathlib import Path

          for path_string in (
              "docs/adr/0005-posterior-esem-dsem.md",
              "docs/research/posterior-esem-input.md",
              "docs/validation/temporal-event-foundation.md",
          ):
              path = Path(path_string)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              normalized = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
              path.write_text(normalized, encoding="utf-8")
          PY
          cargo +1.97.1 fmt --all

      - name: Verify focused and workspace contracts
        run: |
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test -p psychometric_core --all-features
          cargo +1.97.1 clippy -p psychometric_core --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --workspace --all-features
          python3 scripts/check_workspace_contract.py
          python3 scripts/check_docstrings.py
          python3 scripts/validate_documentation.py

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -f .github/workflows/repair-pr49-scientific-claims.yml
          rm -f scripts/repair_pr49_scientific_claims.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(psychometric): narrow geometry and posterior claims"
          git push origin HEAD:agent/psychometric-posterior-esem-input
