name: Repair PR 48 log-ratio numerical stability

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: repair-tepp-pr-48-logratio-stability
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 48 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/topic-logratio-coordinates'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/topic-logratio-coordinates
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Prove stable extreme-coordinate contracts are RED
        run: |
          set +e
          output=$(cargo +1.97.1 test -p topic_measurement --test logratio_recovery_contract 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected direct exponentiation or ratio arithmetic to fail the new stability contracts" >&2
            exit 1
          fi
          grep -E "large_finite_coordinates_round_trip|inverse must not return a zero simplex part" <<<"$output"

      - name: Apply stable ALR arithmetic and documentation repair
        run: |
          python3 scripts/repair_pr48_logratio_stability.py
          cargo +1.97.1 fmt --all

      - name: Verify focused and workspace contracts
        run: |
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test -p topic_measurement --all-features
          cargo +1.97.1 clippy -p topic_measurement --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --workspace --all-features
          python3 scripts/check_workspace_contract.py
          python3 scripts/check_docstrings.py
          python3 scripts/validate_documentation.py

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -f .github/workflows/repair-pr48-logratio-stability.yml
          rm -f scripts/repair_pr48_logratio_stability.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(topic): stabilize extreme log-ratio coordinates"
          git push origin HEAD:agent/topic-logratio-coordinates
