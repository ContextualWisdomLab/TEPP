name: Repair PR 53 stable concept alignment

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: repair-tepp-pr-53-stable-alignment
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 53 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/concept-dictionary-language-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/concept-dictionary-language-profiles
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview

      - name: Prove the pre-implementation RMSE contract was RED
        run: |
          git worktree add "$RUNNER_TEMP/tepp-red" 43419600f5f7a808403f70701defb78c549f7f97
          set +e
          output=$(cd "$RUNNER_TEMP/tepp-red" && cargo +1.97.1 test -p concept_dictionary --test alignment_numeric_stability_contract 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          git worktree remove --force "$RUNNER_TEMP/tepp-red"
          if [ "$status" -eq 0 ]; then
            echo "Expected the naive square accumulator to fail the large-coordinate contract" >&2
            exit 1
          fi
          grep -E "representable RMSE|alignment_numeric_stability_contract" <<<"$output"

      - name: Merge current protected main without discarding feature behavior
        run: |
          git fetch origin main
          git merge --no-edit -X ours origin/main

      - name: Verify focused and workspace contracts
        run: |
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test -p concept_dictionary --all-features
          cargo +1.97.1 clippy -p concept_dictionary --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --workspace --all-features
          python3 scripts/check_workspace_contract.py
          python3 scripts/check_docstrings.py
          python3 scripts/validate_documentation.py

      - name: Enforce exact authored coverage
        run: |
          cargo +1.97.1 install cargo-llvm-cov --locked --version 0.8.6
          cargo +1.97.1 llvm-cov -p concept_dictionary --all-features --fail-under-lines 100 --fail-under-regions 100
          cargo +nightly-2026-08-01 llvm-cov --branch -p concept_dictionary --all-features --json --summary-only --output-path coverage-branches.json
          python3 scripts/check_coverage.py coverage-branches.json --kind branches

      - name: Commit verified merge and remove one-shot workflow
        run: |
          rm -f coverage-branches.json
          rm -f .github/workflows/repair-pr53-stable-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(concept): stabilize shared-space RMSE"
          fi
          git push origin HEAD:agent/concept-dictionary-language-profiles
