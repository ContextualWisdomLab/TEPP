name: Repair temporal serialization failure coverage

on:
  push:
    branches:
      - agent/task-3-six-clock-intervals
    paths:
      - .github/workflows/repair-temporal-serialization-test.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tepp-repair-temporal-serialization-test
  cancel-in-progress: false

jobs:
  repair:
    name: Add regression test, verify, commit, and self-delete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/task-3-six-clock-intervals
          fetch-depth: 0
          persist-credentials: true

      - name: Add a deterministic serialization failure regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/temporal_core/src/wire.rs")
          source_text = source_path.read_text(encoding="utf-8")

          previous_import = '''    use super::{
              BoundaryKind, BoundaryWire, ClockWire, deserialize_wire, map_instant_boundary,
              reconstruct_exact, validate_header,
          };
          use crate::{
              EventTime, TemporalBoundary, TemporalClock, TemporalError, TemporalInstant,
              TemporalInterval, TemporalPrecision,
          };

          #[test]
          fn deserialization_failures_are_redacted() {'''

          replacement_import = '''    use super::{
              BoundaryKind, BoundaryWire, ClockWire, deserialize_wire, map_instant_boundary,
              reconstruct_exact, serialize_wire, validate_header,
          };
          use crate::{
              EventTime, TemporalBoundary, TemporalClock, TemporalError, TemporalInstant,
              TemporalInterval, TemporalPrecision,
          };
          use serde::Serialize;
          use serde::ser::Serializer;

          struct SerializationFailure;

          impl Serialize for SerializationFailure {
              fn serialize<S>(&self, _serializer: S) -> Result<S::Ok, S::Error>
              where
                  S: Serializer,
              {
                  Err(serde::ser::Error::custom("intentional test failure"))
              }
          }

          #[test]
          fn serialization_failures_are_redacted() {
              assert_eq!(
                  serialize_wire(&SerializationFailure),
                  Err(TemporalError::InvalidWirePayload)
              );
          }

          #[test]
          fn deserialization_failures_are_redacted() {'''

          if source_text.count(previous_import) != 1:
              raise SystemExit("expected exactly one temporal test import anchor")
          source_path.write_text(
              source_text.replace(previous_import, replacement_import),
              encoding="utf-8",
          )
          PY

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview

      - name: Install pinned line coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.8.6

      - name: Verify formatting, linting, tests, and exact line coverage
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo llvm-cov --workspace --all-features --json --summary-only --output-path coverage.json
          python3 scripts/check_coverage.py coverage.json --kind lines

      - name: Commit verified regression test and remove this workflow
        run: |
          rm .github/workflows/repair-temporal-serialization-test.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/temporal_core/src/wire.rs .github/workflows/repair-temporal-serialization-test.yml
          git commit -m "test(temporal): cover serialization failure redaction"
          git push origin HEAD:agent/task-3-six-clock-intervals
