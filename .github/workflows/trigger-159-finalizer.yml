name: Trigger PR 159 finalizer

on:
  push:
    branches:
      - feat/lineageweave-project-history-projection
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the pinned finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run finalize-159-lineageweave-project-history-v2.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref feat/lineageweave-project-history-projection
