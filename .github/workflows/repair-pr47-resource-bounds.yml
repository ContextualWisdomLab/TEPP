name: Repair PR 47 orchestration resource bounds

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: repair-tepp-pr-47-resource-bounds
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 47 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/api-adaptive-orchestration-router'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: agent/api-adaptive-orchestration-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Prove unbounded orchestration resources are RED
        run: |
          set +e
          output=$(cargo +1.97.1 test -p tepp_api --test orchestration_resource_bounds_contract 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected missing orchestration resource-bound contract to fail before implementation" >&2
            exit 1
          fi
          grep -E "MAX_ORCHESTRATION|orchestration_resource_bounds_contract" <<<"$output"

      - name: Apply compute and access-list bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              return text.replace(old, new, 1)

          orchestration_path = Path("crates/tepp_api/src/orchestration.rs")
          orchestration = orchestration_path.read_text(encoding="utf-8")
          constants_old = '''/// Contract version for a contextual-orchestrator binding.
          pub const ORCHESTRATION_CONTRACT_VERSION: u16 = 1;

          const EVIDENCE_FLOOR: f64 = 0.35;
          '''.replace("          ", "")
          constants_new = '''/// Contract version for a contextual-orchestrator binding.
          pub const ORCHESTRATION_CONTRACT_VERSION: u16 = 1;

          /// Maximum billable token budget accepted by one orchestration request.
          pub const MAX_ORCHESTRATION_TOKEN_BUDGET: u64 = 1_000_000;
          /// Maximum number of TEPP-owned access capabilities on one request.
          pub const MAX_ORCHESTRATION_ACCESS_ENTRIES: usize = 64;
          /// Maximum UTF-8 byte length of one access capability token.
          pub const MAX_ORCHESTRATION_ACCESS_TOKEN_BYTES: usize = 128;

          const EVIDENCE_FLOOR: f64 = 0.35;
          '''.replace("          ", "")
          orchestration = replace_once(
              orchestration,
              constants_old,
              constants_new,
              "orchestration public resource constants",
          )

          validation_old = '''    require_unit_score(request.risk_score)?;
              require_unit_score(request.ambiguity_score)?;
              require_unit_score(request.evidence_sufficiency)?;
              for token in &request.access_list {
                  require_nonempty(token)?;
              }
              Ok(())
          '''.replace("              ", "")
          validation_new = '''    if request.compute_budget_tokens > MAX_ORCHESTRATION_TOKEN_BUDGET
                  || request.access_list.len() > MAX_ORCHESTRATION_ACCESS_ENTRIES
              {
                  return Err(ApiError::LimitExceeded);
              }
              require_unit_score(request.risk_score)?;
              require_unit_score(request.ambiguity_score)?;
              require_unit_score(request.evidence_sufficiency)?;
              for (index, token) in request.access_list.iter().enumerate() {
                  require_nonempty(token)?;
                  if token.len() > MAX_ORCHESTRATION_ACCESS_TOKEN_BYTES {
                      return Err(ApiError::LimitExceeded);
                  }
                  if request.access_list[..index].contains(token) {
                      return Err(ApiError::InvalidWirePayload);
                  }
              }
              Ok(())
          '''.replace("              ", "")
          orchestration = replace_once(
              orchestration,
              validation_old,
              validation_new,
              "orchestration request resource validation",
          )
          orchestration_path.write_text(orchestration, encoding="utf-8")

          lib_path = Path("crates/tepp_api/src/lib.rs")
          lib = lib_path.read_text(encoding="utf-8")
          export_anchor = '''/// Bounded interpretation task kind.
          pub use orchestration::InterpretationTaskKind;
          '''.replace("          ", "")
          export_replacement = export_anchor + '''/// Maximum access capabilities on one orchestration request.
          pub use orchestration::MAX_ORCHESTRATION_ACCESS_ENTRIES;
          /// Maximum UTF-8 bytes in one orchestration access token.
          pub use orchestration::MAX_ORCHESTRATION_ACCESS_TOKEN_BYTES;
          /// Maximum billable token budget on one orchestration request.
          pub use orchestration::MAX_ORCHESTRATION_TOKEN_BUDGET;
          '''.replace("          ", "")
          lib_path.write_text(
              replace_once(lib, export_anchor, export_replacement, "orchestration exports"),
              encoding="utf-8",
          )

          docs_path = Path("docs/research/adaptive-orchestration-router.md")
          docs = docs_path.read_text(encoding="utf-8").rstrip()
          docs += '''

          ## Resource-authority boundary

          A request may allocate at most 1,000,000 tokens, 64 TEPP-owned access
          capabilities, and 128 UTF-8 bytes per capability token. Duplicate
          capabilities fail closed instead of amplifying or obscuring authority.
          These are admission limits, not a promise that the full budget will be
          consumed; downstream providers remain subject to stricter policy and cost
          controls.
          '''.replace("          ", "")
          docs_path.write_text(docs + "\n", encoding="utf-8")
          PY
          cargo +1.97.1 fmt --all

      - name: Verify focused and workspace contracts
        run: |
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test -p tepp_api --all-features
          cargo +1.97.1 clippy -p tepp_api --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --workspace --all-features
          python3 scripts/check_docstrings.py
          python3 scripts/validate_documentation.py

      - name: Commit verified repair and remove one-shot workflow
        run: |
          rm -f .github/workflows/repair-pr47-resource-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(api): bound orchestration compute authority"
          git push origin HEAD:agent/api-adaptive-orchestration-router
