[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["Contextual Wisdom Lab"]
repository = "https://github.com/ContextualWisdomLab/TEPP"
homepage = "https://github.com/ContextualWisdomLab/TEPP"
readme = "README.md"
keywords = ["psychometrics", "temporal", "events", "topic-modeling", "rust"]
categories = ["science", "algorithms"]

[workspace.dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
getrandom = "=0.4.3"
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
tokio = { version = "=1.47.1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-webpki"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "tls12", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
